<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayPilot — talk to PayPal</title>
<style>
  :root { --pp-blue:#003087; --pp-teal:#0079c1; --bg:#f4f6fb; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--bg);
         margin:0; display:flex; flex-direction:column; height:100vh; }
  header { background:linear-gradient(135deg,var(--pp-blue),var(--pp-teal)); color:#fff;
           padding:14px 20px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.9; }
  #badge { display:inline-block; font-size:11px; background:#ffffff2e; border-radius:10px;
           padding:2px 10px; margin-left:8px; vertical-align:middle; }
  #chat { flex:1; overflow-y:auto; padding:18px; max-width:760px; width:100%; margin:0 auto; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; margin:8px 0;
         white-space:pre-wrap; word-wrap:break-word; font-size:14px; line-height:1.5; }
  .user { background:var(--pp-blue); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .bot  { background:#fff; border:1px solid #dde3f0; border-bottom-left-radius:4px; }
  #bar { display:flex; gap:8px; padding:12px 18px; max-width:760px; width:100%; margin:0 auto; }
  #msg { flex:1; padding:12px 14px; border:1px solid #ccd4e8; border-radius:24px; font-size:14px; }
  button { background:var(--pp-blue); color:#fff; border:none; border-radius:24px;
           padding:0 22px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; padding:0 18px 10px; max-width:760px;
           width:100%; margin:0 auto; }
  .chip { font-size:12px; background:#fff; border:1px solid #ccd4e8; border-radius:16px;
          padding:6px 12px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>💸 PayPilot <span id="badge">loading…</span></h1>
  <p>Natural-language AI agent for PayPal commerce — invoices, payment links, reminders.</p>
</header>
<div id="chat"></div>
<div class="chips" id="chips"></div>
<div id="bar">
  <input id="msg" placeholder="Try: Create an invoice for $450 for painting a house to client@example.com, 8% tax, 5% discount, expires in 10 days" autocomplete="off">
  <button id="send">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const examples = [
  "Create an invoice for $450 for painting a house to client@example.com, add 8% tax and 5% discount, expires in 10 days",
  "send it",
  "Create a $99 payment link for the Pro plan",
  "list my invoices",
  "remind the client about the first invoice"
];
const chips = document.getElementById('chips');
examples.forEach(e => {
  const c = document.createElement('div');
  c.className = 'chip'; c.textContent = e.length > 42 ? e.slice(0,42) + '…' : e;
  c.title = e; c.onclick = () => { input.value = e; send(); };
  chips.appendChild(c);
});
function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; sendBtn.disabled = true;
  addMsg(text, 'user');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await r.json();
    addMsg(data.reply || data.error || 'No response', 'bot');
  } catch (e) {
    addMsg('Network error: ' + e, 'bot');
  }
  sendBtn.disabled = false;
  input.focus();
}
sendBtn.onclick = send;
input.onkeydown = e => { if (e.key === 'Enter') send(); };
fetch('/api/health').then(r => r.json()).then(h => {
  document.getElementById('badge').textContent = 'backend: ' + h.mode;
});
addMsg("Hi! I'm PayPilot. Tell me what to do in plain English — e.g. \"Create an invoice for $450 for painting a house to client@example.com, 8% tax, 5% discount, expires in 10 days\".", 'bot');
</script>
</body>
</html>
